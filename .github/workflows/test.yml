name: test

on:
  push:
    branches:
      - agent/media-engine
      - agent/media-r9-pin-gc-chaos-20260928
      - agent/media-r10-native-mcp-consumer-20260929
      - agent/media-r11-autonomous-reels-20261001
      - agent/media-r12-creative-polish-20261001
      - agent/media-r13-creator-compat-20261001
      - agent/media-r14-realworld-acceptance-20261001
      - agent/media-r15-benchmark-render-export-20261001
      - agent/media-r16-candidate-batch-runtime-20261001
      - agent/media-r17-web-chat-review-bundle-20261001
      - agent/media-r18-direct-model-review-package-20261002
      - agent/media-r19-editorial-runtime-production-20261002
      - agent/media-r20-r19-creator-integration-20261002
      - agent/media-r21-round-pair-review-bundle-20261002
      - agent/media-r22-live-package-materializer-20261002
      - agent/media-r23-next-round-export-20261002
      - agent/media-r24-canonical-live-artifact-20261002
      - agent/media-r25-multicandidate-round-engine-20261004
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: ffmpeg -version && ffprobe -version
      - run: npm run verify:r19
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r19-editorial-reedit
          path: .artifacts/r19-demo
          if-no-files-found: warn
      - run: npm run verify:r20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r20-dynamic-review
          path: .artifacts/r20-demo
          if-no-files-found: error
      - run: npm run verify:r21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r21-round-pair-review
          path: .artifacts/r21-demo
          if-no-files-found: error
      - name: Verify exact accepted R21 Actions authority for R22
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-r22-upstream-r21-artifact.mjs
      - name: Download exact accepted R21 round-pair artifact for R22
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11221240371
          github-token: ${{ github.token }}
          repository: foto6/video2
          run-id: 36994000619
          path: .artifacts/r21-accepted
          merge-multiple: true
      - run: npm run verify:r22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r22-live-review-operator-bundle
          path: .artifacts/r22-live-package
          if-no-files-found: error
      - run: npm run verify:r23
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r23-review-session-package
          path: .artifacts/r23-demo
          if-no-files-found: error
      - name: Verify exact accepted R23 Actions authority for R24
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-r24-upstream-r23-artifact.mjs
      - name: Download exact accepted R23 session artifact for R24
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11226183002
          github-token: ${{ github.token }}
          repository: foto6/video2
          run-id: 37007419237
          path: .artifacts/r23-accepted
          merge-multiple: true
      - run: npm run verify:r24
        env:
          R24_UPSTREAM_ROOT: .artifacts/r23-accepted
      - uses: actions/upload-artifact@v4
        with:
          name: media-r24-canonical-live-review-export
          path: .artifacts/r24-demo
          if-no-files-found: error
      - name: Record R24 Actions artifact readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run record:r24:ci
      - uses: actions/upload-artifact@v4
        with:
          name: media-r24-ci-readiness
          path: .artifacts/r24-actions-readiness.json
          if-no-files-found: error
      - run: npm run verify:r25
      - uses: actions/upload-artifact@v4
        with:
          name: media-r25-multicandidate-tournament
          path: .artifacts/r25-demo
          if-no-files-found: error
      - name: Verify accepted R17 Actions authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-r18-upstream-artifact.mjs
      - name: Download exact accepted R17 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11177570580
          github-token: ${{ github.token }}
          repository: foto6/video2
          run-id: 36890371410
          path: .artifacts/r17-accepted
          merge-multiple: true
      - run: npm run verify:r18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r18-direct-model-review
          path: .artifacts/r18-direct-model-review
          if-no-files-found: warn
      - name: Verify accepted R16 Actions authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/verify-r17-upstream-artifact.mjs
      - name: Download exact accepted R16 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11163920921
          github-token: ${{ github.token }}
          repository: foto6/video2
          run-id: 36865890506
          path: .artifacts/r16-accepted
          merge-multiple: true
      - run: npm run verify:r17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r17-web-chat-review
          path: .artifacts/r17-web-chat-review
          if-no-files-found: warn
      - run: npm run verify:r16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r16-candidate-batch-demo
          path: .artifacts/r16-demo
          if-no-files-found: warn
      - run: npm run test:r15
      - run: npm run test:r14
      - run: npm run verify:r13
      - run: npm run verify:r12
      - run: npm run verify:r11
      - run: npm run test:r10
      - run: npm run test:pin-chaos
      - run: npm run test:pin
      - run: npm run test:retention
      - run: npm run test:artifact
      - run: npm run test:stress
      - run: npm test

  r14-acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case:
          - talking-head-pauses
          - landscape-reframe
          - fast-motion
          - low-motion
          - speech-music
          - subtitle-heavy
          - broll-insert
        style:
          - clean_podcast
          - aggressive_shortform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm run generate:r14
      - name: Run R14 acceptance case/style
        run: >-
          node tools/run-r14-acceptance.mjs
          --input-dir .artifacts/r14-corpus
          --output-dir .artifacts/r14-acceptance/${{ matrix.case }}/${{ matrix.style }}
          --manifest tests/fixtures/r14-acceptance/corpus.json
          --case-id ${{ matrix.case }}
          --style ${{ matrix.style }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r14-case-${{ matrix.case }}-${{ matrix.style }}
          path: .artifacts/r14-acceptance/${{ matrix.case }}/${{ matrix.style }}
          if-no-files-found: error

  r14-aggregate:
    runs-on: ubuntu-latest
    needs:
      - node-test
      - r14-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffprobe -version
      - uses: actions/download-artifact@v4
        with:
          pattern: media-r14-case-*
          path: .artifacts/r14-shards
          merge-multiple: false
      - run: >-
          node tools/aggregate-r14-acceptance.mjs
          --input-dir .artifacts/r14-shards
          --output-dir .artifacts/r14-aggregate
      - name: Prove R15 export against frozen boss benchmark
        run: >-
          node tools/prove-r15-benchmark.mjs
          --input-root .artifacts/r14-shards
          --output-dir .artifacts/r15-benchmark-proof
      - uses: actions/upload-artifact@v4
        with:
          name: media-r14-acceptance
          path: |
            .artifacts/r14-shards
            .artifacts/r14-aggregate
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: media-r15-benchmark-proof
          path: .artifacts/r15-benchmark-proof
          if-no-files-found: error
