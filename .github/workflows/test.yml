name: test

on:
  push:
    branches:
      - agent/media-engine
      - agent/media-r9-pin-gc-chaos-20260928
      - agent/media-r10-native-mcp-consumer-20260929
      - agent/media-r11-autonomous-reels-20261001
      - agent/media-r12-creative-polish-20261001
      - agent/media-r13-creator-compat-20261001
      - agent/media-r14-realworld-acceptance-20261001
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version && ffprobe -version
      - run: npm run test:r14
      - run: npm run verify:r13
      - run: npm run verify:r12
      - run: npm run verify:r11
      - run: npm run test:r10
      - run: npm run test:pin-chaos
      - run: npm run test:pin
      - run: npm run test:retention
      - run: npm run test:artifact
      - run: npm run test:stress
      - run: npm test

  r14-acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - talking-head-pauses
          - landscape-reframe
          - fast-motion
          - low-motion
          - speech-music
          - subtitle-heavy
          - broll-insert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm run generate:r14
      - name: Run R14 acceptance case
        run: >-
          node tools/run-r14-acceptance.mjs
          --input-dir .artifacts/r14-corpus
          --output-dir .artifacts/r14-acceptance/${{ matrix.case }}
          --manifest tests/fixtures/r14-acceptance/corpus.json
          --case-id ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r14-case-${{ matrix.case }}
          path: .artifacts/r14-acceptance/${{ matrix.case }}
          if-no-files-found: error

  r14-aggregate:
    runs-on: ubuntu-latest
    needs:
      - node-test
      - r14-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: media-r14-case-*
          path: .artifacts/r14-shards
          merge-multiple: false
      - run: >-
          node tools/aggregate-r14-acceptance.mjs
          --input-dir .artifacts/r14-shards
          --output-dir .artifacts/r14-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: media-r14-acceptance
          path: |
            .artifacts/r14-shards
            .artifacts/r14-aggregate
          if-no-files-found: error
