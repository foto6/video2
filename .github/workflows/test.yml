name: test

on:
  push:
    branches:
      - agent/media-engine
      - agent/media-r9-pin-gc-chaos-20260928
      - agent/media-r10-native-mcp-consumer-20260929
      - agent/media-r11-autonomous-reels-20261001
      - agent/media-r12-creative-polish-20261001
      - agent/media-r13-creator-compat-20261001
      - agent/media-r14-realworld-acceptance-20261001
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: ffmpeg -version && ffprobe -version
      - run: npm run verify:r14
      - run: npm run verify:r13
      - run: npm run verify:r12
      - run: npm run verify:r11
      - run: npm run test:r10
      - run: npm run test:pin-chaos
      - run: npm run test:pin
      - run: npm run test:retention
      - run: npm run test:artifact
      - run: npm run test:stress
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-r14-acceptance
          path: |
            .artifacts/r14-corpus
            .artifacts/r14-acceptance
            .artifacts/r13-compat
            .artifacts/r12-demo
          if-no-files-found: warn
